syntax = "proto3";
package lit.relay.v1;

option go_package = "github.com/genki/lit/genproto/relay";

message PublishSnapshotRequest {
  string workspace = 1;
  string node_id = 2;
  bytes snapshot_json = 3;
  uint64 size_bytes = 4;
  string hash = 5;
}

message PublishSnapshotResponse {
  string workspace = 1;
  uint64 stored_version = 2;
}

message FetchSnapshotRequest {
  string workspace = 1;
}

message FetchSnapshotResponse {
  string workspace = 1;
  bytes snapshot_json = 2;
  uint64 size_bytes = 3;
  string hash = 4;
  uint64 stored_version = 5;
}

message ListWorkspacesRequest {}

message WorkspaceInfo {
  string workspace = 1;
  uint64 latest_version = 2;
  uint64 updated_at = 3;
}

message ListWorkspacesResponse {
  repeated WorkspaceInfo workspaces = 1;
}

message SubscribeSnapshotsRequest {
  string workspace = 1;
  uint64 from_version = 2;
}

message SnapshotEnvelope {
  string workspace = 1;
  uint64 version = 2;
  bytes snapshot_json = 3;
  uint64 size_bytes = 4;
  string hash = 5;
  uint64 published_at = 6;
}

service RelayService {
  rpc PublishSnapshot(PublishSnapshotRequest) returns (PublishSnapshotResponse);
  rpc FetchSnapshot(FetchSnapshotRequest) returns (FetchSnapshotResponse);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc PublishSnapshotStream(stream PublishSnapshotRequest)
      returns (stream PublishSnapshotResponse);
  rpc SubscribeSnapshots(SubscribeSnapshotsRequest)
      returns (stream SnapshotEnvelope);
}
